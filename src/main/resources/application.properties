# ====================================================================
# UYGULAMA AYARLARI
# ====================================================================
spring.application.name=stock-order-management
server.port=8085
# ====================================================================
# VERITABANI BAGLANTISI (PostgreSQL - Docker'da calisan container)
# TASK GEREKSINIMI: "PostgreSQL veya MySQL"
# ====================================================================
spring.datasource.url=jdbc:postgresql://localhost:5433/stock_order_db
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# ====================================================================
# JPA / HIBERNATE AYARLARI
#
# ddl-auto=validate:
# - Hibernate veritabani semasini OLUSTURMAZ, sadece Entity ile
#   mevcut tablolarin UYUMLU olup olmadigini kontrol eder
# - Sema yonetimi tamamen FLYWAY'e birakilir
#
# NEDEN validate, create-drop veya update DEGIL?
# - create-drop: Her calistirmada tabloyu siler, veri kaybi olur (SADECE TEST icin)
# - update: Otomatik sema degisikligi yapar, PRODUCTION'da TEHLIKELIDIR
#   ongorulemeyen index/constraint kayiplarina yol acabilir
# - validate: Guvenli, Flyway ile kontrollu migration saglar
# ====================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ====================================================================
# FLYWAY MIGRATION AYARLARI
# TASK GEREKSINIMI: "Migration dosyalari"
# ====================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ====================================================================
# SWAGGER / OPENAPI AYARLARI
# TASK GEREKSINIMI (Bonus): "Swagger/OpenAPI"
# ====================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ====================================================================
# LOGGING AYARLARI (Gelistirme icin detayli log)
# ====================================================================
logging.level.com.hibernate.stockordermanagment=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE